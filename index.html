<!DOCTYPE html>
<html class="dark overflow-x-hidden" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Media Player - High-Fidelity Focus</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#201F1F",
            "primary": "#ffffff",
            "surface": "#131313",
            "surface-container-low": "#1c1b1b",
            "surface-container-high": "#2a2a2a",
            "surface-container-highest": "#353434",
            "on-surface": "#e5e2e1",
            "on-surface-variant": "#c4c7c8",
            "outline-variant": "#444748"
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-neutral-50 dark:bg-surface text-neutral-900 dark:text-on-surface antialiased h-screen flex flex-col overflow-x-hidden overflow-y-hidden pt-2 transition-colors duration-200 max-w-full">

  <!-- TopNavBar -->
  <header
    class="bg-white dark:bg-surface border-b border-neutral-200 dark:border-outline-variant w-full h-14 sm:h-16 lg:h-20 sticky top-0 z-50 flex-shrink-0 transition-colors duration-200 overflow-x-hidden">
    <div class="max-w-[1200px] mx-auto w-full flex justify-between items-center px-3 sm:px-6 h-full gap-2">

      <!-- Logo Container -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <span
          class="material-symbols-outlined text-neutral-900 dark:text-primary text-[22px] sm:text-[28px]">graphic_eq</span>
        <span
          class="font-bold text-neutral-900 dark:text-primary text-sm sm:text-base lg:text-xl hidden sm:inline-block whitespace-nowrap">Media
          Player</span>
      </div>

      <!-- Search Input & Actions -->
      <div class="flex items-center gap-1.5 sm:gap-3 flex-1 justify-end max-w-xl min-w-0">
        <div class="relative flex-1 min-w-0 max-w-md">
          <span
            class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-neutral-500 text-[18px]">search</span>
          <input id="playlist-url-input"
            class="w-full bg-neutral-100 dark:bg-surface-container-low border border-neutral-200 dark:border-surface-container-high rounded-full py-1.5 sm:py-2 pl-8 sm:pl-9 pr-3 text-xs sm:text-sm focus:outline-none focus:border-primary transition-colors placeholder-neutral-500 truncate"
            placeholder="Paste Playlist URL..." type="text" />
        </div>

        <button id="load-playlist-btn"
          class="bg-neutral-900 dark:bg-primary text-white dark:text-neutral-900 px-3 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-bold hover:opacity-80 transition-opacity flex-shrink-0">
          Load
        </button>

        <!-- Dark Mode Toggle -->
        <button
          class="w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-neutral-500 dark:text-on-surface-variant hover:bg-neutral-100 dark:hover:bg-surface-container transition-colors flex-shrink-0"
          onclick="document.documentElement.classList.toggle('dark')" title="Toggle Theme">
          <span class="material-symbols-outlined text-[20px] dark:hidden">dark_mode</span>
          <span class="material-symbols-outlined text-[20px] hidden dark:block">light_mode</span>
        </button>

        <!-- Preferences Button -->
        <button id="btn-preferences"
          class="hidden sm:flex w-8 h-8 sm:w-10 sm:h-10 rounded-full items-center justify-center text-neutral-500 dark:text-on-surface-variant hover:bg-neutral-100 dark:hover:bg-surface-container transition-colors flex-shrink-0"
          title="Preferences">
          <span class="material-symbols-outlined text-[20px]">settings</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Canvas -->
  <main
    class="flex-1 overflow-y-auto overflow-x-hidden p-3 sm:p-4 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6 max-w-[1200px] mx-auto w-full pb-36 mt-1 lg:mt-2">

    <!-- Video Player Section -->
    <div class="flex-1 flex flex-col min-w-0 max-w-full">
      <div id="player-wrapper"
        class="w-full aspect-video max-h-[calc(100vh-280px)] lg:max-h-[calc(100vh-300px)] bg-neutral-200 dark:bg-surface-container-high rounded-xl overflow-hidden relative shadow-xl border border-neutral-300 dark:border-surface-container-highest transition-colors mx-auto">
        <div id="yt-player" class="w-full h-full"></div>
      </div>

      <!-- Track Title & Channel Details -->
      <div
        class="mt-3 flex flex-col sm:flex-row justify-between items-start sm:items-center w-full gap-2 sm:gap-4 pb-2 min-w-0">
        <div class="flex flex-col text-left min-w-0 flex-1 max-w-full">
          <h1 id="current-video-title" class="text-base lg:text-lg font-bold truncate leading-snug">Paste a YouTube Playlist to
            Start</h1>
          <p id="current-video-index"
            class="text-xs lg:text-sm text-neutral-500 dark:text-on-surface-variant mt-0.5 truncate max-w-full">Ready for playback
          </p>
          </div>
        <div class="flex gap-2 w-full sm:w-auto flex-shrink-0 pt-1 sm:pt-0">
          <button
            class="flex-1 sm:flex-none justify-center px-3 sm:px-4 py-1.5 rounded-full border border-neutral-300 dark:border-outline-variant text-neutral-700 dark:text-on-surface hover:bg-neutral-100 dark:hover:bg-surface-container text-xs font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px] sm:text-[18px]">favorite</span> SAVE
          </button>
          <button
            class="flex-1 sm:flex-none justify-center px-3 sm:px-4 py-1.5 rounded-full border border-neutral-300 dark:border-outline-variant text-neutral-700 dark:text-on-surface hover:bg-neutral-100 dark:hover:bg-surface-container text-xs font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px] sm:text-[18px]">share</span> SHARE
          </button>
        </div>
      </div>
    </div>

    <!-- Playlist Sidebar -->
    <div
      class="w-full lg:w-[360px] xl:w-[400px] flex-shrink-0 flex flex-col bg-white dark:bg-surface-container-low rounded-xl border border-neutral-200 dark:border-surface-container-high overflow-hidden h-[380px] lg:h-[calc(100vh-180px)] transition-colors">
      <div
        class="p-3 border-b border-neutral-200 dark:border-surface-container-high flex justify-between items-center bg-neutral-50 dark:bg-surface-container-low flex-shrink-0">
        <h2 class="font-bold text-base lg:text-lg">Up Next</h2>
        <span id="playlist-count" class="text-neutral-500 text-xs lg:text-sm">0 tracks</span>
      </div>
      <div id="playlist-container" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1">
        <div class="p-6 text-center text-neutral-500 text-sm mt-10">
          Paste a YouTube playlist URL above and click Load.
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Playback Bar -->
  <div
    class="fixed bottom-0 left-0 w-full bg-white dark:bg-[#0e0e0e] border-t border-neutral-200 dark:border-surface-container-high z-50 h-24 flex flex-col justify-center items-center transition-colors px-2 sm:px-4">
    <div class="w-full max-w-[1200px] flex flex-col justify-center gap-1.5 sm:gap-2 min-w-0">

      <!-- Progress Bar Area -->
      <div class="flex items-center gap-2 sm:gap-4 w-full group min-w-0 select-none">
        <span id="time-current"
          class="text-[10px] sm:text-[12px] text-neutral-500 dark:text-on-surface-variant w-7 sm:w-10 text-right font-mono flex-shrink-0">0:00</span>

        <div id="progress-container" class="flex-1 h-3 flex items-center cursor-pointer relative touch-none">
          <div
            class="w-full h-1.5 bg-neutral-200 dark:bg-surface-container-high rounded-full relative overflow-visible">
            <div id="progress-played"
              class="absolute left-0 top-0 h-full bg-neutral-900 dark:bg-primary rounded-full w-0"></div>
            <div id="progress-scrubber"
              class="absolute top-1/2 -translate-y-1/2 left-0 w-3.5 h-3.5 bg-neutral-900 dark:bg-primary rounded-full -ml-1.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-md pointer-events-none">
            </div>
          </div>
        </div>

        <span id="time-total"
          class="text-[10px] sm:text-[12px] text-neutral-500 dark:text-on-surface-variant w-7 sm:w-10 font-mono flex-shrink-0">0:00</span>
      </div>

      <!-- Controls Area -->
      <div class="flex justify-between items-center w-full min-w-0 gap-1">

        <!-- Mini Track Info -->
        <div class="w-1/3 flex items-center gap-2 min-w-0">
          <div id="mini-thumb"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded overflow-hidden bg-neutral-200 dark:bg-surface-container-high flex-shrink-0 bg-cover bg-center">
          </div>
          <div class="hidden md:block min-w-0 flex-1">
            <h4 id="mini-title"
              class="text-[12px] sm:text-[13px] text-neutral-900 dark:text-on-surface truncate font-medium">No track
              active</h4>
            <p id="mini-artist"
              class="text-[10px] sm:text-[11px] text-neutral-500 dark:text-on-surface-variant truncate">Playlist empty
            </p>
          </div>
        </div>

        <!-- Core Controls (Prev, Play/Pause, Next) -->
        <div class="flex items-center justify-center gap-2 sm:gap-4 flex-1">
          <button id="btn-prev"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-neutral-700 dark:text-on-surface hover:text-neutral-900 dark:hover:text-primary transition-colors flex-shrink-0">
            <span class="material-symbols-outlined fill text-[20px] sm:text-[24px]">skip_previous</span>
          </button>

          <button id="btn-play-pause"
            class="w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-neutral-900 dark:bg-primary flex items-center justify-center text-white dark:text-neutral-900 hover:scale-105 transition-all shadow-md flex-shrink-0">
            <span id="play-icon" class="material-symbols-outlined fill text-[22px] sm:text-[28px]">play_arrow</span>
          </button>

          <button id="btn-next"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-neutral-700 dark:text-on-surface hover:text-primary transition-colors flex-shrink-0">
            <span class="material-symbols-outlined fill text-[20px] sm:text-[24px]">skip_next</span>
          </button>
        </div>

        <!-- Volume & Fullscreen Controls -->
        <div class="w-1/3 flex items-center justify-end gap-1 min-w-0">
          <button id="btn-volume"
            class="hidden sm:flex w-8 h-8 sm:w-10 sm:h-10 rounded-full items-center justify-center text-neutral-500 dark:text-on-surface-variant hover:text-neutral-900 dark:hover:text-on-surface transition-colors flex-shrink-0">
            <span id="volume-icon" class="material-symbols-outlined text-[18px] sm:text-[20px]">volume_up</span>
          </button>

          <div id="volume-container"
            class="hidden sm:flex w-16 sm:w-24 h-1.5 bg-neutral-200 dark:bg-surface-container-high rounded-full relative cursor-pointer items-center flex-shrink-0">
            <div id="volume-fill"
              class="absolute left-0 h-full bg-neutral-500 dark:bg-on-surface-variant rounded-full w-full"></div>
          </div>

          <button id="btn-fullscreen"
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-neutral-500 dark:text-on-surface-variant hover:text-neutral-900 dark:hover:text-on-surface transition-colors sm:ml-2 flex-shrink-0">
            <span class="material-symbols-outlined text-[20px]">fullscreen</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>

</html>
